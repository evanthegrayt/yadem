name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck zsh

      - name: Check Bash syntax
        run: |
          bash -n \
            bin/yadem \
            bin/lib/yadem.sh \
            bin/yadem.d/* \
            completions/yadem.bash \
            config/yademrc \
            test/*.bash \
            test/*.bats

      - name: Check zsh syntax
        run: zsh -n completions/yadem.zsh

      - name: Run ShellCheck
        run: |
          shellcheck \
            bin/yadem \
            bin/lib/yadem.sh \
            bin/yadem.d/* \
            completions/yadem.bash \
            config/yademrc \
            test/*.bash \
            test/*.bats

      - name: Run Bats tests
        run: bats test
